# Datacentre leaf-spine fabric: 1 spine, 2 leaves, 1 host per leaf. eBGP between spine and leaves.
name: dc01

topology:
  nodes:
    spine1:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/spine1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.1.1/30 dev eth1
        - ip addr add 10.0.2.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up
    leaf1:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/leaf1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.1.2/30 dev eth1
        - ip addr add 192.168.101.1/24 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up
    leaf2:
      kind: linux
      image: quay.io/frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/leaf2/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.2.2/30 dev eth1
        - ip addr add 192.168.102.1/24 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up
    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.101.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.102.0/24 via 192.168.101.1
    host2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.102.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.101.0/24 via 192.168.102.1

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "host1:eth1"]
    - endpoints: ["leaf2:eth2", "host2:eth1"]
